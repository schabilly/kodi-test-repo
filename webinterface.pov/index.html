<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar">
        <h1>POV</h1>
        <button data-path="plugin://plugin.video.pov/?name=32483&amp;iconImage=next_episodes.png&amp;mode=build_next_episode">Next Episodes</button>
        <button data-path="plugin://plugin.video.pov/?name=33067&amp;iconImage=trending_recent&amp;mode=build_movie_list&amp;action=trakt_movies_trending_recent">Trending Movies</button>
        <button data-path="plugin://plugin.video.pov/?name=33067&amp;iconImage=trending_recent&amp;mode=build_tvshow_list&amp;action=trakt_tv_trending_recent">Trending TV</button>
        <button data-path="plugin://plugin.video.pov/?mode=build_movie_list&amp;action=trakt_watchlist">Movie Watchlist</button>
        <button data-path="plugin://plugin.video.pov/?mode=build_tvshow_list&amp;action=trakt_watchlist">TV Watchlist</button>
        <button data-path="plugin://plugin.video.pov/?mode=real_debrid.rd_torrent_cloud">RD Cloud</button>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search...">
            <select id="searchFilter">
                <option value="both" selected>Movies & TV</option>
                <option value="movies">Movies</option>
                <option value="tv">TV Shows</option>
            </select>
            <button id="searchBtn">Search</button>
        </div>
    </nav>
    <main class="content">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="grid" id="grid"></div>
        <div class="loading" id="loading">Loading...</div>
        <div class="error" id="error"></div>
    </main>
    <div class="modal hidden" id="modal">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-panel" id="modalPanel"></div>
    </div>
    <div class="video-modal hidden" id="videoModal">
        <div class="video-modal-backdrop" id="videoModalBackdrop"></div>
        <div class="video-modal-panel">
            <button class="video-modal-close" id="videoModalClose">&times;</button>
            <video id="videoPlayer" controls playsinline></video>
        </div>
    </div>
    <div class="player-bar hidden" id="playerBar">
        <div class="player-thumb" id="playerThumb"></div>
        <div class="player-info">
            <div class="player-title" id="playerTitle">-</div>
            <div class="player-progress">
                <div class="player-progress-bar" id="playerProgressBar"></div>
            </div>
        </div>
        <div class="player-controls">
            <button id="playerPlayPause" title="Play/Pause">▶</button>
            <button id="playerStop" title="Stop">■</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
